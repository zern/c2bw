name: Build macOS binaries
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build single-file executable
        run: |
          python -m PyInstaller --noconfirm --clean c2bw_macos.spec
          mv dist/c2bw "dist/c2bw-macos-${{ matrix.arch }}"
          chmod +x "dist/c2bw-macos-${{ matrix.arch }}"
      - name: Verify architecture
        run: |
          file "dist/c2bw-macos-${{ matrix.arch }}"
          test -x "dist/c2bw-macos-${{ matrix.arch }}"
      - name: Generate checksum
        run: shasum -a 256 "dist/c2bw-macos-${{ matrix.arch }}" > "dist/c2bw-macos-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: c2bw-macos-${{ matrix.arch }}
          path: |
            dist/c2bw-macos-${{ matrix.arch }}
            dist/c2bw-macos-${{ matrix.arch }}.sha256
          if-no-files-found: error