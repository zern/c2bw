name: Release Windows builds
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-win11:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Windows 10/11 executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean c2bw.spec
          Rename-Item dist/c2bw.exe c2bw-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/c2bw-windows-x86_64.exe

  build-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build Windows 7 executable
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<60.7" "wheel<0.46"
          python -m pip install -r requirements-win7.txt
          python -m PyInstaller --noconfirm --clean c2bw_win7.spec
          Rename-Item dist/c2bw_win7.exe c2bw-windows7-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows7-x86_64
          path: dist/c2bw-windows7-x86_64.exe

  release:
    needs: [build-win11, build-win7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Package source
        shell: bash
        run: |
          git archive --format=zip --output=release-assets/c2bw-source.zip HEAD
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows-x86_64/c2bw-windows-x86_64.exe
            release-assets/windows7-x86_64/c2bw-windows7-x86_64.exe
            release-assets/c2bw-source.zip
          generate_release_notes: true